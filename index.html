<!DOCTYPE html> 

<html lang="ru">

<head>

    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Моя первая страница</title>
    
    <link rel="stylesheet" href="styles.css">
    
</head>

<body>
    <div class='calculate'>
        <div class='price-and-sum grid'>счетчик</div>
            <div class='products grid'>
                <div class='carrot col-4'>Морковь</div>
                <div class='onion col-4'>Лук</div>
                <div class='tomato col-4'>Томаты</div>
            </div>
            <div class='buttons grid'>
                <div class='button-1 col-4 grid'>
                    <button class='dec col-1' onclick='incrementCarrot()'>+</button>
                        <div id='carrot-count' class='count col-1'>0</div>
                    <button class='dec col-1' onclick='decrementCarrot()'>-</button>
                </div>
                <div class='button-2 col-4 grid'>
                    <button class='dec col-1' onclick='incrementOnion()'>+</button>
                        <div id='onion-count' class='count col-1'>0</div>
                    <button class='dec col-1' onclick='decrementOnion()'>-</button>
                </div>
                <div class='button-3 col-4 grid'>
                    <button class='dec col-1' onclick='incrementTomato()'>+</button>
                        <div id='tomato-count' class='count col-1'>0</div>
                    <button class='dec col-1' onclick='decrementTomato()'>-</button>
                </div>
            </div>
        <div class='main-info grid'>
            <div class='price col-4'>цена за килограмм</div> 
            <div class='sum col-8'>общая сумма</div>
        </div>
        <div class='position-price grid'>
            <div class='price-1 col-4'>стоимость</div> 
            <div class='price-2 col-4'>стоимость2</div>
            <div class='price-3 col-4'>стоимость3</div>
        </div>
    </div>

    <script src="main.js"></script>
   
</body>
</html>
