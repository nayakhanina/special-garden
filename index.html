<!DOCTYPE html> 

<html lang="ru">

<head>

    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Моя первая страница</title>
    
    <link rel="stylesheet" href="styles.css">
    
</head>

<body>
    <div class='calculate'>
        <div class='price-and-sum grid'>счетчик</div>
        <div class='products grid'>
            <div class='carrot col-1'>Морковь</div>
                <button>+</button>
                0
                 <button>-</button>
            <div class='onion col-1'>Лук</div>
                <button>+</button>
                0
                <button>-</button>
            <div class='tomato col-1'>Томаты</div>
                <button>+</button>
                0
                <button>-</button>
        </div>
        <div class='main-info grid'>
            <div class='price col-4'>цена за килограмм</div> 
            <div class='sum col-8'>общая сумма</div>
        </div>
        <div class='position-price grid'>
            <div class='price-1 col-4'>стоимость</div> 
            <div class='price-2 col-4'>стоимость2</div>
            <div class='price-3 col-4'>стоимость3</div>
        </div>
    </div>

    <script src="main.js"></script>
   
</body>
</html>
